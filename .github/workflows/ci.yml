name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpcsclite-dev \
            pkg-config

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules are tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Coverage smoke test
        run: go test -cover ./...

      - name: Build CLI
        run: go build -o /tmp/fidoctl ./cmd/fidoctl

  native-hid:
    name: Native HID (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet HID and USB
        run: go vet ./pkg/hid/... ./pkg/transport/usb/...
      - name: Test HID and USB
        run: go test ./pkg/hid/... ./pkg/transport/usb/...
      - name: Race test HID and USB
        if: runner.os != 'Windows'
        run: go test -race ./pkg/hid/... ./pkg/transport/usb/...
      - name: Check build without cgo
        env:
          CGO_ENABLED: '0'
        run: go test ./pkg/hid/... ./pkg/transport/usb/...
